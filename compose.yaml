# Twine and Fiber start together. Fiber RPC stays on 127.0.0.1:8227 inside
# the container until Twine is wired to it. P2P is published on 8228.
#
# Before the first start:
#   cp .env.example .env          # set FIBER_SECRET_KEY_PASSWORD
#   mkdir -p fiber-node/ckb
#   # write the CKB private key to fiber-node/ckb/key (mode 600)
#
# The image copies its bundled testnet config to fiber-node/config.yml when
# that file is missing. For mainnet, set
# FIBER_CONFIG_TEMPLATE=/usr/local/share/fiber/config/mainnet/config.yml
# and point ckb.rpc_url at a trusted mainnet endpoint in the copied config.

services:
  fiber:
    image: nervos/fiber:v0.9.1
    restart: unless-stopped
    environment:
      FIBER_SECRET_KEY_PASSWORD: ${FIBER_SECRET_KEY_PASSWORD:?Set FIBER_SECRET_KEY_PASSWORD in .env}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./fiber-node:/fiber
    ports:
      - "8228:8228"

  twine:
    build: .
    restart: unless-stopped
    depends_on:
      - fiber
